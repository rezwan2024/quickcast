<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>QuickCast Widget</title>
    <style>
      /* Transparent background so only the pill itself is visible once this
         page is embedded as an iframe over an arbitrary host page — this
         page's own <html>/<body> would otherwise paint as an opaque box. */
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
